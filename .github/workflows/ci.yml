# The .NET rig job runs without secrets. The Unity jobs need the GameCI secrets
# and the repository variable UNITY_CI_ENABLED=true; the IL2CPP job is manual.
name: Unity package CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_il2cpp:
        description: Build and run an optional Linux IL2CPP player
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rig:
    name: .NET rig tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run runtime and test suite
        run: dotnet run --project Tools~/rig/rig.csproj -p:RuntimeDir=../../Runtime -p:TestsDir=../../Tests

  tests:
    name: ${{ matrix.testMode }} tests
    needs: rig
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # GameCI package mode hangs when the package is the repository root. Stage a copy
      # in a subdirectory and point the test runner at that copy.
      - name: Stage the package for GameCI
        shell: bash
        run: |
          mkdir -p .ci/package
          git archive HEAD | tar -x -C .ci/package

      - name: Run Unity package tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .ci/package
          unityVersion: 6000.0.85f1
          testMode: ${{ matrix.testMode }}
          packageMode: true
          artifactsPath: artifacts/${{ matrix.testMode }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.testMode }}-test-results
          path: artifacts/${{ matrix.testMode }}
          if-no-files-found: ignore
          retention-days: 14

  il2cpp:
    name: Optional Linux IL2CPP player build and smoke run
    needs: rig
    if: ${{ vars.UNITY_CI_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.run_il2cpp }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create a minimal Unity project that references this package
        shell: bash
        run: |
          project=".ci/Il2CppProject"
          mkdir -p "$project/Assets/Editor" "$project/Packages/com.woolongok.november" "$project/ProjectSettings"
          git archive HEAD | tar -x -C "$project/Packages/com.woolongok.november"
          cat > "$project/ProjectSettings/ProjectVersion.txt" <<'EOF'
          m_EditorVersion: 6000.0.85f1
          EOF
          cat > "$project/Packages/manifest.json" <<'EOF'
          {
            "dependencies": {}
          }
          EOF
          cat > "$project/Assets/NovemberIl2CppSmoke.cs" <<'EOF'
          using System;
          using November.DI;
          using UnityEngine;
          using UnityEngine.Scripting;

          public sealed class NovemberIl2CppSmoke : MonoBehaviour
          {
              private void Awake()
              {
                  try
                  {
                      using (var container = new DiContainer())
                      {
                          container.Register<NovemberIl2CppDependency>(Lifetime.Singleton);
                          container.Register<NovemberIl2CppService>(Lifetime.Singleton);
                          Func<NovemberIl2CppService> factory = container.Resolve<Func<NovemberIl2CppService>>();
                          Lazy<NovemberIl2CppService> lazy = container.Resolve<Lazy<NovemberIl2CppService>>();
                          NovemberIl2CppService resolved = factory();
                          if (resolved == null || !resolved.IsInjected || lazy.Value == null)
                              throw new InvalidOperationException("November DI IL2CPP smoke test failed.");
                      }

                      Debug.Log("NOVEMBER_IL2CPP_SMOKE_OK");
                      Application.Quit(0);
                  }
                  catch (Exception ex)
                  {
                      Debug.LogException(ex);
                      Application.Quit(1);
                  }
              }
          }

          [Preserve]
          public sealed class NovemberIl2CppDependency
          {
          }

          [Preserve]
          public sealed class NovemberIl2CppService
          {
              [Inject] private NovemberIl2CppDependency _dependency;

              public bool IsInjected => _dependency != null;

              [Inject]
              private NovemberIl2CppService() { }
          }
          EOF
          cat > "$project/Assets/link.xml" <<'EOF'
          <linker>
            <assembly fullname="Assembly-CSharp">
              <type fullname="NovemberIl2CppDependency" preserve="all" />
              <type fullname="NovemberIl2CppService" preserve="all" />
            </assembly>
          </linker>
          EOF
          cat > "$project/Assets/Editor/NovemberIl2CppBuild.cs" <<'EOF'
          using System;
          using UnityEditor;
          using UnityEditor.Build;
          using UnityEditor.Build.Reporting;
          using UnityEditor.SceneManagement;
          using UnityEngine;
          using UnityEngine.SceneManagement;

          namespace November.CI
          {
              public static class Il2CppBuild
              {
                  public static void Build()
                  {
                      const string scenePath = "Assets/NovemberIl2CppSmoke.unity";
                      Scene scene = EditorSceneManager.NewScene(NewSceneSetup.EmptyScene, NewSceneMode.Single);
                      GameObject root = new GameObject("NovemberIl2CppSmoke");
                      root.AddComponent<NovemberIl2CppSmoke>();
                      EditorSceneManager.SaveScene(scene, scenePath);
                      EditorBuildSettings.scenes = new[]
                      {
                          new EditorBuildSettingsScene(scenePath, true)
                      };

                      PlayerSettings.SetScriptingBackend(
                          NamedBuildTarget.Standalone,
                          ScriptingImplementation.IL2CPP);
                      PlayerSettings.SetManagedStrippingLevel(
                          NamedBuildTarget.Standalone,
                          ManagedStrippingLevel.High);

                      string projectRoot = System.IO.Path.GetDirectoryName(Application.dataPath);
                      string outputDirectory = System.IO.Path.Combine(projectRoot, "artifacts/il2cpp");
                      System.IO.Directory.CreateDirectory(outputDirectory);

                      BuildReport report = BuildPipeline.BuildPlayer(new BuildPlayerOptions
                      {
                          scenes = new[] { scenePath },
                          locationPathName = System.IO.Path.Combine(outputDirectory, "NovemberIl2CppSmoke.x86_64"),
                          target = BuildTarget.StandaloneLinux64,
                          options = BuildOptions.None
                      });

                      if (report.summary.result != BuildResult.Succeeded)
                          throw new Exception("Linux IL2CPP build failed: " + report.summary.result);
                  }
              }
          }
          EOF

      - name: Build Linux IL2CPP player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .ci/Il2CppProject
          unityVersion: 6000.0.85f1
          targetPlatform: StandaloneLinux64
          buildMethod: November.CI.Il2CppBuild.Build
          buildsPath: artifacts/il2cpp
          allowDirtyBuild: true

      - name: Run the IL2CPP player headlessly
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb

          player="$(find .ci/Il2CppProject/artifacts -name NovemberIl2CppSmoke.x86_64 -type f -print -quit)"
          test -n "$player"
          chmod +x "$player"

          mkdir -p .ci/il2cpp-logs
          timeout 180s xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$player" -batchmode -nographics -logFile - | tee .ci/il2cpp-logs/player.log

          grep -q "NOVEMBER_IL2CPP_SMOKE_OK" .ci/il2cpp-logs/player.log

      - name: Upload IL2CPP player
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-il2cpp-player
          path: |
            .ci/Il2CppProject/artifacts/il2cpp
            .ci/il2cpp-logs
          if-no-files-found: ignore
          retention-days: 14
